<!DOCTYPE html>
<html>
<head>
  <script type="module" src="https://unpkg.com/@wokwi/elements@latest/dist/wokwi-elements/wokwi-elements.esm.js"></script>
  <style>
    body { padding: 50px; background: #222; }
    .container { position: relative; display: inline-block; margin: 20px; }
    .box { position: absolute; width: 8px; height: 8px; border: 1px solid red; }
    wokwi-led { --led-color: red; }
  </style>
</head>
<body>
  <div class="container" id="cont-led">
    <div style="transform: scale(1.5); transform-origin: top left;">
      <wokwi-led color="red"></wokwi-led>
    </div>
    <!-- Add my circuitPins.ts values for LED -->
    <div class="box" style="left: 21px; top: 82.5px;"></div>
    <div class="box" style="left: 39px; top: 82.5px;"></div>
  </div>

  <script>
    setTimeout(() => {
        const led = document.querySelector('wokwi-led');
        const rect = led.getBoundingClientRect();
        const svg = led.shadowRoot.querySelector('svg');
        console.log("LED Bounding Rect:", rect);
        if (svg) {
            console.log("LED SVG viewBox:", svg.getAttribute('viewBox'));
            const a = svg.querySelector('#A');
            if (a) {
                const aRect = a.getBoundingClientRect();
                console.log("Pin A Rect:", aRect);
                console.log("Relative Pin A:", aRect.left - rect.left, aRect.top - rect.top);
            }
        }
    }, 2000);
  </script>
</body>
</html>
